version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: plataforma_postgres
    environment:
      POSTGRES_DB: PlataformaGab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: debora806
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: plataforma_api
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=PlataformaGab;Username=postgres;Password=debora806;
      - Jwt__Key=minha-chave-super-secreta-com-pelo-menos-32-caracteres-para-ser-segura-jwt-plataforma-gabariando-quimica
      - Jwt__Issuer=PlataformaGab
      - Jwt__Audience=PlataformaGab-Users
      - Jwt__ExpirationMinutes=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: